<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIUUUU! ARCHIVE ULTIMATE PREMIUM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root { --main: #eab308; --bg: #fdfbf7; --text: #44403c; --green: #10b981; --pink: #fb7185; --blue: #38bdf8; }
        body { background-color: var(--bg); color: var(--text); margin: 0; font-family: 'Pretendard', sans-serif; transition: 0.5s; overflow-x: hidden; }
        .scroll-container { display: flex; overflow-x: auto; gap: 12px; scrollbar-width: none; padding: 10px 20px; -webkit-overflow-scrolling: touch; cursor: grab; }
        .scroll-container::-webkit-scrollbar { display: none; }
        .post-card { background: white; border-radius: 35px; margin: 0 15px 30px; position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.04); overflow: hidden; }
        .image-slider { display: flex; overflow-x: auto; snap-type: x mandatory; background: #f1f5f9; scrollbar-width: none; }
        .image-slider img { flex: 0 0 100%; width: 100%; max-height: 500px; object-fit: cover; snap-align: start; cursor: pointer; }
        .cal-day { height: 100px; vertical-align: top; padding: 8px; border: 0.5px solid rgba(0,0,0,0.05); cursor: pointer; background: #fff; position: relative; }
        .ev-h { display: flex; flex-direction: column; gap: 3px; margin-top: 5px; overflow-y: auto; max-height: 70px; scrollbar-width: none; }
        .day-label { font-size: 10px; padding: 4px 6px; border-radius: 6px; color: white !important; display: block; font-weight: 800; text-align: center; white-space: nowrap; overflow: hidden; }
        .label-green { background: var(--green) !important; } .label-pink { background: var(--pink) !important; }
        textarea { width: 100%; min-height: 180px; border: none; background: #f8fafc; border-radius: 20px; padding: 25px; font-size: 16px; outline: none; resize: none; box-sizing: border-box; }
        .tag-btn { flex: 0 0 auto; padding: 12px 28px; border-radius: 50px; background: white; border: 2px solid rgba(0,0,0,0.05); font-size: 14px; font-weight: 800; cursor: pointer; }
        .tag-btn.active { color: white !important; transform: scale(1.05); }
        .comment-item { font-size: 13px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .comment-gif { display: block; max-width: 150px; border-radius: 10px; margin-top: 5px; cursor: pointer; }
        .post-manage-btns { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 10; }
        .m-btn { background: rgba(255,255,255,0.8); border: none; padding: 5px 10px; border-radius: 10px; font-size: 11px; cursor: pointer; font-weight: bold; color: #666; }
        .like-badge { cursor: pointer; display: inline-flex; align-items: center; gap: 5px; background: #fff0f3; color: #ff4d6d; padding: 5px 12px; border-radius: 15px; font-size: 13px; font-weight: 800; border: none; transition: 0.2s; }
        .like-badge:active { transform: scale(1.2); }
        
        #bDayBanner { display: none; background: linear-gradient(90deg, #fb7185, #eab308); color: white; text-align: center; padding: 15px; font-weight: 900; font-size: 1.1rem; border-radius: 0 0 20px 20px; margin-bottom: 10px; animation: slideDown 0.5s ease; }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        .dday-box { margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
        .dday-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .dday-card { background: #f8fafc; padding: 10px; border-radius: 15px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        .dday-tag { color: var(--pink); font-weight: 900; }
    </style>
</head>
<body>

<div id="bDayBanner"></div>

<!-- 사진 크게 보기 모달 -->
<div id="lightbox" onclick="closeLightbox()" style="display:none; position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,0.9); justify-content:center; align-items:center; cursor:pointer;">
    <span style="position:absolute; top:20px; right:25px; color:white; font-size:30px; font-weight:bold;">✕</span>
    <img id="lightboxImg" src="" style="max-width:90%; max-height:85vh; border-radius:15px; object-fit:contain;">
</div>

<div id="gate" style="display: flex; position: fixed; inset: 0; z-index: 9999; background: #fdfbf7; flex-direction: column; align-items: center; justify-content: center;">
    <h1 style="font-size: 5rem; font-weight: 900; color: #eab308; font-style: italic;">SIUUUU!</h1>
    <div style="width: 300px; margin-top: 30px;">
        <input id="userName" type="text" placeholder="이름을 입력하세요" style="width: 100%; padding: 20px; border-radius: 20px; border: 2px solid #eee; text-align: center; font-size: 18px; outline: none;">
        <button onclick="handleLogin()" style="width: 100%; background: #eab308; color: white; padding: 20px; border-radius: 20px; font-weight: 900; border: none; margin-top:10px; cursor: pointer;">SQUAD IN</button>
    </div>
</div>

<div id="app" style="display: none; max-width: 600px; margin: 0 auto; padding-bottom: 100px;">
    <header style="padding: 40px 25px 20px; display: flex; justify-content: space-between; align-items: center;">
        <h1 id="mainTitle" style="font-size: 2.5rem; font-weight: 900; font-style: italic; margin:0;">SIUUUU! 🔥</h1>
        <button onclick="handleLogout()" style="opacity: 0.4; border: 1px solid #ccc; padding: 8px 15px; border-radius: 12px; background: none; cursor: pointer;">EXIT</button>
    </header>

    <!-- 캘린더 및 D-Day 카드 -->
    <div class="post-card" style="padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 id="calMonth" style="margin: 0; font-weight: 900; font-size: 1.5rem;"></h2>
            <div style="display: flex; gap: 20px; color: #eab308; font-weight: 900; cursor: pointer;">
                <span onclick="moveMonth(-1)">◀</span> <span onclick="moveMonth(1)">▶</span>
            </div>
        </div>
        <table style="width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 11px;">
            <thead style="color: #94a3b8; height: 30px;"><tr><th>SUN</th><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th></tr></thead>
            <tbody id="calBody"></tbody>
        </table>

        <div class="dday-box">
            <p style="margin: 0 0 10px; font-size: 13px; font-weight: 800; color: #94a3b8;">SQUAD BIRTHDAY D-DAY</p>
            <div id="ddayList" class="dday-grid"></div>
        </div>

        <div id="dateEditor" style="display:none; margin-top: 20px; padding: 20px; background: #fdfbf7; border-radius: 25px; border: 1px solid #eee; position: relative;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <p id="selectedDateText" style="font-size: 15px; font-weight: 900; color: #10b981; margin: 0;"></p>
                <button onclick="closeDateEditor()" style="border: none; background: none; font-size: 16px; font-weight: bold; cursor: pointer; color: #888;">✕</button>
            </div>
            <div id="existingEvents"></div>
            <div style="display: flex; gap: 8px; margin-top:10px;">
                <input id="dateInput" type="text" placeholder="일정 입력" style="flex:1; padding: 15px; border-radius: 15px; border:1px solid #eee; outline: none;">
                <button onclick="saveDateEvent()" style="background: #10b981; color:white; border:none; padding: 0 25px; border-radius: 15px; font-weight: 900; cursor: pointer;">추가</button>
            </div>
        </div>
    </div>

    <!-- 신규 기능: 이번 달 스쿼드 랭킹 / 통계 -->
    <div class="post-card" style="padding: 20px; margin-bottom: 20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleLeaderboard()">
            <h3 style="margin:0; font-weight:900; font-size:1.1rem; color:#eab308;">🏆 이번 달 스쿼드 랭킹</h3>
            <span id="lbToggleIcon" style="font-size:12px; color:#888; font-weight:bold;">▼ 열기</span>
        </div>
        <div id="leaderboardContent" style="display:none; margin-top:15px; border-top:1px solid #eee; padding-top:12px;"></div>
    </div>

    <!-- 신규 기능: 게시글 키워드 검색창 -->
    <div style="margin: 0 15px 12px;">
        <input id="searchInput" type="text" placeholder="🔍 키워드 또는 작성자 이름 검색..." oninput="handleSearch()" style="width:100%; padding:15px 22px; border-radius:50px; border:2px solid rgba(0,0,0,0.05); outline:none; font-size:14px; background:white; box-sizing:border-box; box-shadow: 0 5px 15px rgba(0,0,0,0.02);">
    </div>

    <div class="category-wrapper" style="position: sticky; top: 0; z-index: 100; background: var(--bg); padding: 5px 0 10px;">
        <div class="scroll-container" id="categoryScroll">
            <button onclick="changeTheme('all', this)" class="tag-btn active" data-color="#eab308" data-bg="#fdfbf7">#전체</button>
            <button onclick="changeTheme('추억', this)" class="tag-btn" data-color="#38bdf8" data-bg="#f0f9ff">#추억🧸</button>
            <button onclick="changeTheme('생일', this)" class="tag-btn" data-color="#fb7185" data-bg="#fff1f2">#생일🎂</button>
            <button onclick="changeTheme('태지아', this)" class="tag-btn" data-color="#ff4d6d" data-bg="#fff0f3">#태지아</button>
            <button onclick="changeTheme('조성우', this)" class="tag-btn" data-color="#007bff" data-bg="#f0f7ff">#조성우</button>
            <button onclick="changeTheme('염태성', this)" class="tag-btn" data-color="#20c997" data-bg="#f0fffb">#염태성</button>
            <button onclick="changeTheme('김태현', this)" class="tag-btn" data-color="#9b5de5" data-bg="#f8f4ff">#김태현</button>
            <button onclick="changeTheme('이준서', this)" class="tag-btn" data-color="#f15bb5" data-bg="#fff0f9">#이준서</button>
            <button onclick="changeTheme('이지호', this)" class="tag-btn" data-color="#d4a373" data-bg="#fdf8f3">#이지호</button>
            <button onclick="changeTheme('이다원', this)" class="tag-btn" data-color="#7b2cbf" data-bg="#f5f0ff">#이다원</button>
        </div>
    </div>

    <div class="input-area" style="margin: 20px 15px;">
        <textarea id="pContent" placeholder="기록할 내용을 시원하게 입력하세요..."></textarea>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px;">
            <input type="file" id="pFile" style="display: none;" multiple onchange="updateFileStatus(this)">
            <label for="pFile" id="fLab" style="flex: 1; text-align: center; padding: 18px; background: white; border-radius: 20px; font-weight: 800; border: 2px dashed #e2e8f0; color: #94a3b8; cursor: pointer;">사진 추가</label>
            <button onclick="savePost()" id="sBtn" style="flex: 1.2; background: #eab308; color: white; border-radius: 20px; font-weight: 900; border: none; cursor: pointer;">기억 저장</button>
            <button onclick="runLucky()" style="flex: 0.6; background: #10b981; color: white; border-radius: 20px; font-weight: 900; border: none; cursor: pointer;">🍀</button>
        </div>
    </div>

    <!-- 신규 기능: N년 전 오늘 추억 소환 영역 -->
    <div id="onThisDayBox" style="margin: 0 15px 20px; display:none;"></div>

    <div id="feed"></div>
</div>

<script>
    const SB_URL = 'https://chlqufwjiwfiqzvmocof.supabase.co', SB_KEY = 'sb_publishable_MyGDUC1VPEyrWP6THcgWEA_mk8HUpQj'; 
    const ANNIVERSARIES = { "01-01": "신정 ☀️", "02-14": "발렌타인 🍫", "03-01": "삼일절 🇰🇷", "03-14": "화이트데이 🍭", "05-05": "어린이날 🎈", "05-08": "어버이날 💐", "12-25": "크리스마스 🎄" };
    const SQUAD_COLORS = { '태지아': '#ff4d6d', '조성우': '#007bff', '염태성': '#20c997', '김태현': '#9b5de5', '이준서': '#f15bb5', '이지호': '#d4a373', '이다원': '#7b2cbf', '추억': '#38bdf8', '생일': '#fb7185' };
    const SQUAD = Object.keys(SQUAD_COLORS);
    
    const BIRTHDAYS = {
        "01-03": "염태성", "01-16": "태지아", "01-21": "이준서",
        "03-19": "이다원", "04-27": "김태현", "05-04": "이지호", "09-15": "조성우"
    };

    let client, viewDate = new Date(), selDate = "", allSchedules = [];
    let currentTag = 'all', currentSearchQuery = '';

    window.onload = function() { 
        client = supabase.createClient(SB_URL, SB_KEY); 
        if (localStorage.getItem('siu_user')) showApp(); 
        const sc = document.getElementById('categoryScroll');
        if(sc) sc.addEventListener('wheel', (e) => { e.preventDefault(); sc.scrollLeft += e.deltaY; });
        checkTodayBirthday();
    };

    function handleLogin() { 
        const n = document.getElementById('userName').value.trim(); 
        if (SQUAD.includes(n)) { localStorage.setItem('siu_user', n); showApp(); } 
        else alert("멤버가 아닙니다!"); 
    }
    
    function showApp() { 
        document.getElementById('gate').style.display = 'none'; 
        document.getElementById('app').style.display = 'block'; 
        renderCalendar(); 
        renderDDay();
        loadFeed(); 
    }
    
    function handleLogout() { localStorage.removeItem('siu_user'); location.reload(); }

    /* Lightbox 함수 */
    function openLightbox(url) {
        document.getElementById('lightboxImg').src = url;
        document.getElementById('lightbox').style.display = 'flex';
    }
    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }

    /* 검색 처리 함수 */
    function handleSearch() {
        currentSearchQuery = document.getElementById('searchInput').value.trim();
        loadFeed(currentTag);
    }

    /* 랭킹 접기/열기 */
    function toggleLeaderboard() {
        const content = document.getElementById('leaderboardContent');
        const icon = document.getElementById('lbToggleIcon');
        if (content.style.display === 'none') {
            content.style.display = 'block';
            icon.innerText = '▲ 접기';
        } else {
            content.style.display = 'none';
            icon.innerText = '▼ 열기';
        }
    }

    /* 이번 달 스쿼드 랭킹 계산 */
    function renderLeaderboard(posts) {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();

        const thisMonthPosts = posts.filter(p => {
            if(!p.created_at) return false;
            const d = new Date(p.created_at);
            return d.getFullYear() === year && d.getMonth() === month;
        });

        const postCounts = {}, likeCounts = {}, commentCounts = {};
        SQUAD.forEach(m => { postCounts[m] = 0; likeCounts[m] = 0; commentCounts[m] = 0; });

        thisMonthPosts.forEach(p => {
            if(postCounts[p.user_name] !== undefined) postCounts[p.user_name]++;
            if(likeCounts[p.user_name] !== undefined) likeCounts[p.user_name] += (p.likes || 0);

            (p.comments || []).forEach(c => {
                const cd = c.created_at ? new Date(c.created_at) : now;
                if(cd.getFullYear() === year && cd.getMonth() === month) {
                    if(commentCounts[c.user_name] !== undefined) commentCounts[c.user_name]++;
                }
            });
        });

        const getTopUser = (obj) => {
            let topUser = '-', maxVal = 0;
            Object.entries(obj).forEach(([user, val]) => {
                if (val > maxVal) { maxVal = val; topUser = user; }
            });
            return maxVal > 0 ? `${topUser} (${maxVal}회)` : '아직 없음';
        };

        const content = document.getElementById('leaderboardContent');
        content.innerHTML = `
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; font-size: 12px;">
                <div style="background: #f8fafc; padding: 12px 5px; border-radius: 15px;">
                    <div style="font-size: 18px; margin-bottom: 4px;">✍️</div>
                    <div style="font-weight: 800; color: #64748b;">기록왕</div>
                    <div style="font-weight: 900; color: #eab308; margin-top: 4px;">${getTopUser(postCounts)}</div>
                </div>
                <div style="background: #f8fafc; padding: 12px 5px; border-radius: 15px;">
                    <div style="font-size: 18px; margin-bottom: 4px;">👑</div>
                    <div style="font-weight: 800; color: #64748b;">인싸왕</div>
                    <div style="font-weight: 900; color: #fb7185; margin-top: 4px;">${getTopUser(likeCounts)}</div>
                </div>
                <div style="background: #f8fafc; padding: 12px 5px; border-radius: 15px;">
                    <div style="font-size: 18px; margin-bottom: 4px;">💬</div>
                    <div style="font-weight: 800; color: #64748b;">소통왕</div>
                    <div style="font-weight: 900; color: #10b981; margin-top: 4px;">${getTopUser(commentCounts)}</div>
                </div>
            </div>
        `;
    }

    /* N년 전 오늘 추억 소환 계산 */
    function renderOnThisDay(posts) {
        const today = new Date();
        const curYear = today.getFullYear();
        const m = today.getMonth() + 1;
        const d = today.getDate();

        const matches = posts.filter(p => {
            if (!p.created_at) return false;
            const pDate = new Date(p.created_at);
            return pDate.getFullYear() < curYear && (pDate.getMonth() + 1) === m && pDate.getDate() === d;
        });

        const box = document.getElementById('onThisDayBox');
        if (matches.length === 0) { box.style.display = 'none'; return; }

        box.style.display = 'block';
        box.innerHTML = matches.map(p => {
            const diffYears = curYear - new Date(p.created_at).getFullYear();
            return `
            <div style="background: linear-gradient(135deg, #e0f2fe, #fef3c7); padding: 18px 22px; border-radius: 25px; border: 1px solid #bae6fd; box-shadow: 0 10px 20px rgba(0,0,0,0.03);">
                <div style="font-weight: 900; font-size: 13px; color: #0284c7; margin-bottom: 6px;">💡 ${diffYears}년 전 오늘의 추억 소환!</div>
                <div style="font-size: 14px; color: #334155; line-height: 1.5; font-weight: 600;">"${p.content}"</div>
                <div style="font-size: 11px; color: #0369a1; margin-top: 8px; text-align: right; font-weight: 800;">BY ${p.user_name}</div>
            </div>`;
        }).join('');
    }

    function checkTodayBirthday() {
        const today = new Date();
        const mmdd = `${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        if (BIRTHDAYS[mmdd]) {
            const banner = document.getElementById('bDayBanner');
            banner.innerHTML = `🎂 오늘은 <b>${BIRTHDAYS[mmdd]}</b>님의 생일! 태어나주셔서 감사합니다! ❤️`;
            banner.style.display = 'block';
        }
    }

    function renderDDay() {
        const listDiv = document.getElementById('ddayList');
        const today = new Date();
        today.setHours(0,0,0,0);
        let html = "";

        Object.entries(BIRTHDAYS).forEach(([md, name]) => {
            let bDate = new Date(`${today.getFullYear()}-${md}`);
            if (bDate < today) bDate.setFullYear(today.getFullYear() + 1);
            
            const diff = Math.ceil((bDate - today) / (1000 * 60 * 60 * 24));
            const ddayStr = diff === 0 ? "TODAY! 🔥" : `D-${diff}`;
            
            html += `<div class="dday-card"><span>${name}</span><span class="dday-tag">${ddayStr}</span></div>`;
        });
        listDiv.innerHTML = html;
    }

    async function renderCalendar() {
        const y = viewDate.getFullYear(), m = viewDate.getMonth();
        document.getElementById('calMonth').innerText = `${y}.${String(m+1).padStart(2,'0')}`;
        const first = new Date(y, m, 1).getDay(), last = new Date(y, m+1, 0).getDate();
        const body = document.getElementById('calBody');
        
        const { data, error } = await client.from('schedules').select('*'); 
        if (error) console.error("일정 불러오기 에러:", error);
        allSchedules = data || []; 
        
        body.innerHTML = '';
        let date = 1;
        for (let i = 0; i < 6; i++) {
            let row = document.createElement('tr');
            for (let j = 0; j < 7; j++) {
                let cell = document.createElement('td'); cell.className = "cal-day";
                if (!(i === 0 && j < first || date > last)) {
                    const mmdd = `${String(m+1).padStart(2,'0')}-${String(date).padStart(2,'0')}`, dKey = `${y}-${mmdd}`;
                    let ev = ANNIVERSARIES[mmdd] ? `<span class="day-label label-pink">${ANNIVERSARIES[mmdd]}</span>` : '';
                    if(BIRTHDAYS[mmdd]) ev += `<span class="day-label label-pink">🎂 ${BIRTHDAYS[mmdd]}</span>`;
                    
                    ev += allSchedules.filter(s => s.target_date === dKey).map(s => `<span class="day-label ${s.title.match(/생일|기념일|Day/) ? 'label-pink' : 'label-green'}" style="margin-top:2px;">${s.title}</span>`).join('');
                    cell.innerHTML = `<span style="opacity:0.3; font-weight:bold;">${date}</span><div class="ev-h">${ev}</div>`;
                    cell.onclick = () => openDateEditor(dKey); date++;
                }
                row.appendChild(cell);
            }
            body.appendChild(row); if (date > last) break;
        }
    }

    function openDateEditor(d) {
        selDate = d;
        document.getElementById('dateEditor').style.display = 'block';
        document.getElementById('selectedDateText').innerText = `📅 ${d}`;
        const mine = allSchedules.filter(s => s.target_date === d);
        document.getElementById('existingEvents').innerHTML = mine.length > 0 
            ? mine.map(s => `<div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #eee;"><span>${s.title} (${s.user_name || '익명'})</span><button onclick="deleteSchedule('${s.id}')" style="color:#ef4444; border:none; background:none; font-weight:bold; cursor:pointer;">✕</button></div>`).join('')
            : `<p style="font-size:12px; color:#aaa; margin:5px 0;">등록된 일정이 없습니다.</p>`;
    }

    function closeDateEditor() {
        document.getElementById('dateEditor').style.display = 'none';
    }

    async function saveDateEvent() {
        const input = document.getElementById('dateInput');
        const t = input.value.trim();
        if(!t) return alert("일정 내용을 입력해주세요!");
        
        const currentUser = localStorage.getItem('siu_user') || '익명';
        const { error } = await client.from('schedules').insert([{ user_name: currentUser, title: t, target_date: selDate }]);
        
        if (error) { alert("일정 저장 실패: " + error.message); return; }
        
        input.value = "";
        await renderCalendar();
        openDateEditor(selDate);
    }

    async function deleteSchedule(id) {
        if(confirm("이 일정을 삭제할까요?")) {
            const { error } = await client.from('schedules').delete().eq('id', id);
            if (error) { alert("일정 삭제 실패: " + error.message); return; }
            await renderCalendar();
            openDateEditor(selDate);
        }
    }

    async function loadFeed(filter = currentTag) {
        currentTag = filter;
        const feedDiv = document.getElementById('feed');
        const currentUser = localStorage.getItem('siu_user');
        let { data: posts, error } = await client.from('posts').select('*, comments(*)').order('created_at', { ascending: false });
        if (error) { console.error("피드 불러오기 에러:", error); return; }
        posts = posts || [];
        
        renderLeaderboard(posts);
        renderOnThisDay(posts);

        let filtered = posts;
        if(currentTag !== 'all') {
            if(['추억','생일'].includes(currentTag)) filtered = filtered.filter(p => p.content.includes(currentTag));
            else filtered = filtered.filter(p => p.user_name === currentTag);
        }

        if(currentSearchQuery) {
            const q = currentSearchQuery.toLowerCase();
            filtered = filtered.filter(p => p.content.toLowerCase().includes(q) || p.user_name.toLowerCase().includes(q));
        }
        
        feedDiv.innerHTML = filtered.map(p => {
            const isGif = (c) => c.content.match(/\.(gif|webp)$|giphy|tenor/i);
            const imagesHtml = (p.image_url||'').split(',').filter(u=>u).map(u => `<img src="${u}" onclick="openLightbox('${u}')">`).join('');

            return `
            <div class="post-card">
                ${p.user_name === currentUser ? `
                    <div class="post-manage-btns">
                        <button class="m-btn" onclick="editPost('${p.id}', \`${p.content.replace(/`/g, '\\`')}\`)">수정</button>
                        <button class="m-btn" onclick="deletePost('${p.id}')">삭제</button>
                    </div>
                ` : ''}
                <div class="image-slider">${imagesHtml}</div>
                <div style="padding:25px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b style="color:${SQUAD_COLORS[p.user_name] || '#444'}">BY ${p.user_name}</b>
                        <button class="like-badge" onclick="addLike('${p.id}', ${p.likes || 0})">❤️ ${p.likes || 0}</button>
                    </div>
                    <p id="content-${p.id}" style="font-size:16px; margin:10px 0 20px; line-height:1.7; white-space:pre-wrap;">${p.content}</p>
                    <div id="comments-${p.id}" style="border-top:1px solid #eee; padding-top:15px;">
                        ${(p.comments || []).map(c => `
                            <div class="comment-item">
                                <span><b>${c.user_name}</b> ${isGif(c) ? `<img class="comment-gif" src="${c.content}" onclick="openLightbox('${c.content}')">` : c.content}</span>
                                ${c.user_name === currentUser ? `<small onclick="deleteComment('${c.id}')" style="opacity:0.3; cursor:pointer;">✕</small>` : ''}
                            </div>`).join('')}
                    </div>
                    <div style="display:flex; gap:10px; background:#f8fafc; padding:5px 12px; border-radius:12px; margin-top:10px; align-items:center;">
                        <input type="text" placeholder="댓글..." id="cIn-${p.id}" onkeydown="if(event.key==='Enter') addComment('${p.id}')" style="flex:1; border:none; outline:none; background:none; font-size:14px;">
                        <button onclick="addComment('${p.id}', true)" style="border:none; background:none; font-size:18px; cursor:pointer; filter:grayscale(1);">🖼️</button>
                        <button onclick="addComment('${p.id}')" style="border:none; background:none; color:#eab308; font-weight:bold; cursor:pointer;">UP</button>
                    </div>
                </div>
            </div>`;
        }).join('') || `<p style="text-align:center; color:#aaa; margin:40px 0; font-size:14px;">검색 결과나 기록이 없습니다. 😅</p>`;
    }

    async function addLike(id, currentLikes) {
        const { error } = await client.from('posts').update({ likes: currentLikes + 1 }).eq('id', id);
        if (error) alert("좋아요 실패: " + error.message); else loadFeed();
    }

    async function addComment(pId, isGifPrompt = false) { 
        const i = document.getElementById(`cIn-${pId}`);
        let c = i.value.trim(); 
        if (isGifPrompt) {
            const gifUrl = prompt("GIF 링크(URL)를 입력하세요:");
            if (gifUrl) c = gifUrl; else return;
        }
        if(!c) return; 
        const { error } = await client.from('comments').insert([{ post_id: pId, content: c, user_name: localStorage.getItem('siu_user') }]); 
        if (error) alert("댓글 저장 실패: " + error.message);
        else { i.value=""; loadFeed(); }
    }

    async function savePost() {
        const c = document.getElementById('pContent').value.trim();
        const f = document.getElementById('pFile').files;
        const user = localStorage.getItem('siu_user');
        
        if(!c && f.length === 0) return alert("내용이나 사진을 추가하세요!");
        
        const btn = document.getElementById('sBtn'); 
        btn.innerText = "저장 중..."; 
        btn.disabled = true;

        try {
            let urls = [];
            for(let file of f) {
                const fileExt = file.name.split('.').pop();
                const cleanFileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                
                const { error: uploadErr } = await client.storage.from('photos').upload(cleanFileName, file);
                if (uploadErr) throw uploadErr;
                
                const { data } = client.storage.from('photos').getPublicUrl(cleanFileName);
                if(data && data.publicUrl) urls.push(data.publicUrl);
            }

            const { error: insertErr } = await client.from('posts').insert([{ 
                content: c, 
                image_url: urls.join(','), 
                user_name: user, 
                likes: 0 
            }]);

            if (insertErr) throw insertErr;

            alert("기억 저장 완료! 🔥");
            document.getElementById('pContent').value = ""; 
            document.getElementById('pFile').value = "";
            document.getElementById('fLab').innerText = "사진 추가"; 
            loadFeed();
        } catch(e) { 
            console.error(e);
            alert("저장 실패: " + (e.message || "Supabase 권한을 확인해주세요.")); 
        } finally { 
            btn.innerText = "기억 저장"; 
            btn.disabled = false; 
        }
    }

    async function deletePost(id) {
        if (!confirm("정말 이 기록과 사진을 모두 지울까요?")) return;
        try {
            await client.from('comments').delete().eq('post_id', id);

            const { data: post } = await client.from('posts').select('image_url').eq('id', id).single();
            if (post && post.image_url) {
                const urls = post.image_url.split(',').filter(u => u); 
                const fileNames = urls.map(url => url.split('/').pop());
                if (fileNames.length > 0) await client.storage.from('photos').remove(fileNames);
            }

            const { error } = await client.from('posts').delete().eq('id', id);
            if (error) throw error;

            alert("삭제 완료! ✨"); 
            loadFeed();
        } catch (e) { 
            alert("삭제 실패: " + e.message); 
        }
    }

    async function editPost(id, oldContent) { 
        const newContent = prompt("내용을 수정하세요:", oldContent); 
        if (newContent !== null) { 
            const { error } = await client.from('posts').update({ content: newContent }).eq('id', id); 
            if (error) alert("수정 실패: " + error.message);
            else loadFeed(); 
        } 
    }

    async function deleteComment(id) { 
        if(confirm("댓글을 삭제할까요?")) { 
            const { error } = await client.from('comments').delete().eq('id', id); 
            if (error) alert("댓글 삭제 실패: " + error.message);
            else loadFeed(); 
        } 
    }

    function changeTheme(tag, btn) { 
        document.body.style.backgroundColor = btn.dataset.bg; 
        document.getElementById('mainTitle').style.color = btn.dataset.color; 
        document.querySelectorAll('.tag-btn').forEach(b => { 
            b.classList.remove('active'); 
            b.style.backgroundColor = 'white'; 
            b.style.color = 'var(--text)'; 
        }); 
        btn.classList.add('active'); 
        btn.style.backgroundColor = btn.dataset.color; 
        btn.style.color = 'white'; 
        loadFeed(tag); 
    }

    function moveMonth(v) { viewDate.setMonth(viewDate.getMonth() + v); renderCalendar(); }

    function runLucky() { 
        const user = localStorage.getItem('siu_user') || "guest"; 
        const today = new Date().toISOString().split('T')[0]; 
        const seed = user + today; 
        let hash = 0; 
        for (let i = 0; i < seed.length; i++) { hash = ((hash << 5) - hash) + seed.charCodeAt(i); hash |= 0; } 
        const score = Math.abs(hash % 41) + 60; 
        const msgs = ["대박! 🔥", "운이 좋네요! 🚀", "평온한 하루! 😊", "SIUUU! 🍀"]; 
        alert(`🍀 [${user}] 운세: ${score}%\n${msgs[score>=90?0:score>=80?1:score>=70?2:3]}`); 
    }

    function updateFileStatus(i) { document.getElementById('fLab').innerText = `📸 ${i.files.length}장 선택됨`; }
</script>
</body>
